<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Complex Form</h1><br/><br/>

    <form>

        <fieldset>
            <legend>Personal Information</legend>


            <label for="name">Name</label>
            <input type="text" name="name" id="name">

            <label for="emailID">Email</label>
            <input type="email" name="emailID" id="emailID">

            <label for="phoneNumber">Phone</label>
            <input type="tel" name="phoneNumber" id="phoneNumber">

            <label for="dob">Name</label>
            <input type="date" name="dob" id="dob">

           <p style="display:inline">Gender</p>

            <input type="radio" name="gender" id="male">
            <label for="male">Male</label>

            <input type="radio" name="gender" id="female">
            <label for="female">Female</label>


            <label for="country">Country</label>
            <select name="country" id="country">
                <option value="bangladesh">Bangladesh</option>
                <option value="india">India</option>
                <option value="china">China</option>
                <option value="pakistan">Pakistan</option>
                <option value="nepal">Nepal</option>
            </select>

        </fieldset>


        <fieldset>

            <legend>
                Address

                <label for="street">Street</label>
                <input type="text" name="street" id="street">

                <label for="city">City</label>
                <input type="text" name="city" id="city">

                <label for="state">State</label>
                <input type="text" name="state" id="state">

                <label for="zeepCode">Zeep Code</label>
                <input type="text" name="zeepCode" id="zeepCode">
            
            
            </legend>
        </fieldset>

        <fieldset>
            <legend>Other Information</legend>

            <label for="comments">Comments</label>
            <textarea name="comments" id="comments"></textarea>

            <label for="agree">I agree to the terms of sercice</label>
            <input type="checkbox" name="agree" id="agree">
        </fieldset>

        <button>submit</button>

    </form>
</body>
</html>
