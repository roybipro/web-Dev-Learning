<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Card</title>
</head>
<body>
    <div>

        <div class="container">

            <div class="card">

                <img src="tech.jpg" alt="img">

                <!-- text Box content -->
                <div class="textBox">
                     <h2>Order Summary</h2>
                     <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Impedit labore velit, dolorem soluta quibusdam obcaecati deleniti tempora voluptatem ratione dolorum?</p>
                </div>
               
                <div id="amountBox">

                    <div>
                        <div class="leftBox">
                            <div class="imgBox">
                                <img src="MusicLogo.jpeg" alt="img">
                            </div>
                            <div class="textAmountBox">
                            <p>Amount</p>
                            <p>$999/year</p>
                            </div>
                        </div>
                        <div class="rightBox">
                            <a href="#">Change</a>
                        </div>
                    </div>

                </div>

                <button id="paymentButton" type="submit">Pay Now</button>

                <div class="cancelBox">

                <a href="#">Cancel Order</a>

                </div>

            </div>

        </div>

    </div>
</body>
</html>
