<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bipros Blogs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body_container">

    <div class="container">

        <!-- Header code -->
        <header class="header_container">

            <h1 class="header_title">Bipros Blog</h1>

            <p class="header_desc"> Utilize this space to incorporate a captivating subheading crafted by ChatGPT, adding depth and intrigue to your blog.</p>

        </header>

        <!-- Main Code -->
        <main class="Main_container">

            <!-- Card 1 Code Start -->

            <div class="card_container">

                <a href="#" class="card_image_container">
                    <img src="https://loremflickr.com/600/400/technology" alt="Tech Image" class="card_image" loading="lazy">
                </a>

                <div class="card_taitle_container">

                    <a href="#">
                       <h2 class="card_title">New Gadgets Relesed</h2> 
                    </a>
                    <p class="card_desc">
                        Check out the latest tech gadgets hitting the market, from smartphones to smartwatches.
                    </p>

                </div>

                <div class="card_footer_container">
                    <!-- author container -->
                    <div class="author_container">
                        <div class="author_avatar_container">
                            <img src="https://api.dicebear.com/7.x/notionists/svg?seed=John?size=64" alt="avatar1" loading="lazy" class="author_avatar"> 
                        </div>
                        <div class="author_info_container">
                            <span>
                                Dipto Roy
                            </span>
                            <span>
                                sept 19,2021
                            </span>
                        </div>
                    </div>
                    <!-- Card Tag Container -->
                    <div class="card_tag_container">
                        <span>Technology</span>
                    </div>

                </div>
            </div>

            <!-- Card 2 Code End -->

        </main>



    </div>
    
</body>
</html>
